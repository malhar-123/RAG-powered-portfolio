<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Oval background -->
  <ellipse cx="200" cy="200" rx="180" ry="190" fill="#3b5998" opacity="0.1"/>
  
  <!-- Avatar circle -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b5998;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d4373;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="200" cy="180" r="120" fill="url(#grad)"/>
  
  <!-- Head -->
  <circle cx="200" cy="150" r="70" fill="#e4e6eb"/>
  
  <!-- Eyes -->
  <circle cx="180" cy="135" r="6" fill="#0a0e27"/>
  <circle cx="220" cy="135" r="6" fill="#0a0e27"/>
  
  <!-- Smile -->
  <path d="M 180 160 Q 200 170 220 160" stroke="#0a0e27" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Body outline -->
  <path d="M 150 210 Q 130 250 140 300 L 260 300 Q 270 250 250 210 Z" fill="#e4e6eb"/>
  
  <!-- Accent border -->
  <ellipse cx="200" cy="200" rx="180" ry="190" fill="none" stroke="#3b5998" stroke-width="2" opacity="0.3"/>
</svg>
